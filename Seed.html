<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seed</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Одна колонка: пароль → новый кошелёк → мои кошельки → ручная расшифровка */
:root{
  --bg:#eef1f0; --panel:#ffffff; --fg:#17201e; --muted:#5d6b68; --line:#d3dbd9;
  --accent:#0f7a68; --accent-fg:#ffffff; --warn:#a34a12; --warn-bg:#fbeee3; --ok:#1f7a3a;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101615; --panel:#18211f; --fg:#e4ecea; --muted:#93a39f; --line:#2a3633;
  --accent:#3fc2a8; --accent-fg:#06211c; --warn:#f0a36a; --warn-bg:#2b1d12; --ok:#6bd48a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --panel:#18211f; --fg:#e4ecea; --muted:#93a39f; --line:#2a3633;
  --accent:#3fc2a8; --accent-fg:#06211c; --warn:#f0a36a; --warn-bg:#2b1d12; --ok:#6bd48a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:16px 40px}
main{max-width:520px;margin:0 auto;display:grid;gap:16px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);padding:9px 14px;font:500 14px var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:transparent;color:var(--fg);padding:11px 14px;border-radius:8px;font:500 15px var(--sans);cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);flex:1}
.small{padding:6px 10px;font-size:13px;border-radius:6px}
.danger{color:var(--warn)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-family:var(--mono);font-size:14px;counter-reset:w}
.words span{border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;gap:6px;min-width:0;overflow-wrap:anywhere}
.words span::before{counter-increment:w;content:counter(w);color:var(--muted);font-size:11px;min-width:1.4em;text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.words.blur span{filter:blur(6px)}
.empty{color:var(--muted);font-size:14px;margin:0}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
label.check{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px}
label.check input{width:auto}
input,textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:15px var(--sans)}
textarea{font:13px var(--mono);min-height:84px;resize:vertical}
.msg{font-size:14px;min-height:1.2em;margin:0}
.msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}
.addrs{display:grid;gap:6px}
.addr{display:grid;grid-template-columns:5.2em 1fr auto;gap:8px;align-items:center;min-width:0}
.addr b{font:500 12px var(--sans);color:var(--muted)}
.addr code{font:12px var(--mono);overflow-wrap:anywhere;min-width:0}
.addr button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:5px 8px;font:500 12px var(--sans);cursor:pointer}
.wallet{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.whead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.whead strong{font-size:15px}
.whead small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pill{font:500 11px var(--sans);letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
#count{text-transform:none;letter-spacing:0}
.tools{display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:5px 12px;font:500 13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.badge{font:500 11px var(--sans);letter-spacing:.03em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge.done{background:var(--accent);color:var(--accent-fg)}
.badge.todo{border:1px solid var(--line);color:var(--muted)}
.whead .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.primary.small{flex:0 0 auto}
.balbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.balbar .sum{display:grid;gap:2px}
.balbar .sum b{font:700 20px var(--sans);font-variant-numeric:tabular-nums}
.balbar .sum small{color:var(--muted);font-size:12px}
.bals{display:flex;flex-wrap:wrap;gap:6px}
.bal{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
.bal.pos{color:var(--fg);border-color:var(--accent)}
.bal.usd{color:var(--fg)}
.qty{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty .stepper{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-items:stretch}
.qty .stepper button{border:0;background:transparent;color:var(--fg);width:40px;font:500 18px var(--sans);cursor:pointer}
.qty .stepper input{width:56px;text-align:center;border:0;border-radius:0;background:transparent;padding:8px 0;font:500 16px var(--sans);font-variant-numeric:tabular-nums}
.qty .presets{display:flex;gap:6px}
.qty span.lbl{font-size:13px;color:var(--muted)}
progress{width:100%;height:6px;accent-color:var(--accent)}
.bt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.bt input{margin-top:3px}
.bt b{font-size:14px}
.bt code{grid-column:2;font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.bt.on{border-color:var(--accent)}
</style>
</head>
<body>
<main>

  <section aria-labelledby="hp">
    <h2 id="hp">Пароль шифрования</h2>
    <label>Без этого пароля сохранённые фразы не открыть
      <input id="pw" type="password" autocomplete="new-password" placeholder="от 8 символов, лучше 12+">
    </label>
    <label class="check"><input id="rem" type="checkbox"> Запомнить на этом телефоне</label>
  </section>

  <section aria-labelledby="hbt">
    <h2 id="hbt">Формат BTC-адреса</h2>
    <p class="sub" style="margin:0">Выберите тот, что показывает SafePal для этой же фразы. Все варианты принадлежат вашей фразе — меняется только вид адреса.</p>
    <div id="btcTypes" style="display:grid;gap:8px"></div>
    <p id="m4" class="msg" role="status"></p>
  </section>

  <section aria-labelledby="hn">
    <h2 id="hn">Новый кошелёк</h2>
    <label>Название (пусто = номер по порядку)
      <input id="label" autocomplete="off" placeholder="например: Основной">
    </label>
    <div class="qty">
      <span class="lbl">Сколько создать</span>
      <div class="stepper">
        <button id="qm" aria-label="Меньше">−</button>
        <input id="qn" type="number" inputmode="numeric" min="1" max="50" value="1" aria-label="Количество кошельков">
        <button id="qp" aria-label="Больше">+</button>
      </div>
      <div class="presets">
        <button class="chip" data-q="5">5</button>
        <button class="chip" data-q="10">10</button>
        <button class="chip" data-q="20">20</button>
      </div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Количество слов">
        <button id="n12" aria-pressed="true">12 слов</button>
        <button id="n24" aria-pressed="false">24 слова</button>
      </div>
      <button class="btn primary" id="gen">Создать</button>
    </div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <div id="newBox" hidden>
      <div style="display:grid;gap:10px">
        <div class="whead"><strong id="newTitle"></strong><small id="newDate"></small></div>
        <div id="words" class="words"></div>
        <div id="addrs" class="addrs"></div>
        <div class="row">
          <button class="btn" id="copy">Копировать фразу</button>
          <button class="btn" id="hide">Скрыть</button>
        </div>
      </div>
    </div>
    <p id="m1" class="msg" role="status"></p>
  </section>

  <section aria-labelledby="hw">
    <h2 id="hw"><span>Мои кошельки</span><span id="count"></span></h2>
    <div class="balbar" id="balbar" hidden>
      <div class="sum"><small>Всего на кошельках</small><b id="total">—</b><small id="balTime">Балансы ещё не загружались</small></div>
      <button class="btn small" id="balBtn">Обновить балансы</button>
    </div>
    <div id="notifyRow" hidden style="display:grid;gap:6px">
      <label class="check"><input id="notifyBtc" type="checkbox" checked> Уведомлять о поступлении BTC</label>
      <label class="check"><input id="notifyOther" type="checkbox" checked> Уведомлять об остальных монетах (USDT, TRX, SOL и др.)</label>
    </div>
    <div class="tools" id="tools" hidden>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Поиск по названию или адресу">
      <div class="chips" role="group" aria-label="Фильтр">
        <button class="chip" data-f="all" aria-pressed="true">Все</button>
        <button class="chip" data-f="todo" aria-pressed="false">Не в SafePal</button>
        <button class="chip" data-f="done" aria-pressed="false">В SafePal</button>
        <button class="chip" data-f="funded" aria-pressed="false">С балансом</button>
      </div>
    </div>
    <div id="list" style="display:grid;gap:10px"><p class="empty">Загружаю…</p></div>
    <p id="m2" class="msg" role="status"></p>
  </section>

  <section aria-labelledby="hd">
    <details>
      <summary id="hd">Расшифровать строку SP1: вручную</summary>
      <div style="display:grid;gap:10px;margin-top:12px">
        <textarea id="dIn" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="Вставьте сообщение или строку SP1:…"></textarea>
        <button class="btn primary" id="dec">Расшифровать</button>
        <div id="dWords" class="words" hidden></div>
        <div id="dAddrs" class="addrs" hidden></div>
        <p id="m3" class="msg" role="status"></p>
      </div>
    </details>
  </section>
</main>

/* ---------- BIP39 ---------- */
function bits(bytes){ return [...bytes].map(b => b.toString(2).padStart(8,"0")).join(""); }
async function entropyToMnemonic(ent){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", ent));
  const b = bits(ent) + bits(h).slice(0, ent.length * 8 / 32);
  const out = [];
  for (let i = 0; i < b.length; i += 11) out.push(WL[parseInt(b.slice(i, i+11), 2)]);
  return out;
}
async function validMnemonic(words){
  if (![12,15,18,21,24].includes(words.length)) return false;
  const idx = words.map(w => WL.indexOf(w));
  if (idx.includes(-1)) return false;
  const b = idx.map(i => i.toString(2).padStart(11,"0")).join("");
  const ent = new Uint8Array(b.length * 32 / 33 / 8);
  for (let i = 0; i < ent.length; i++) ent[i] = parseInt(b.slice(i*8, i*8+8), 2);
  return (await entropyToMnemonic(ent)).join(" ") === words.join(" ");
}

function b64(u8){ let s=""; for (const x of u8) s += String.fromCharCode(x); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function key(pw, salt){

  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encrypt(text, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await key(pw, salt), enc.encode(text)));
  const all = new Uint8Array(28 + ct.length); all.set(salt); all.set(iv, 16); all.set(ct, 28);
  return "SP1:" + b64(all);
}
async function decrypt(c, pw){
  const all = unb64(c.slice(4));
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:all.slice(16,28)}, await key(pw, all.slice(0,16)), all.slice(28));
  return dec.decode(pt).split(" ");
}

  for (let i = 0; i < wallets.length; i++){
    const w = wallets[i];
    $("balBtn").textContent = "Загружаю " + (i+1) + " из " + wallets.length + "…";
    const [t, b, s] = await Promise.allSettled([balTron(w.a.trx), balBtc(w.a.btc), balSol(w.a.sol)]);
    const prev = bal.w[w.k] || {};
    const cur = {
      usdt: t.status === "fulfilled" ? t.value.usdt : prev.usdt,
      trx:  t.status === "fulfilled" ? t.value.trx  : prev.trx,
      btc:  b.status === "fulfilled" ? b.value : prev.btc,
      sol:  s.status === "fulfilled" ? s.value : prev.sol
    };
    errs += [t, b, s].filter(x => x.status !== "fulfilled").length;
    bal.w[w.k] = cur;
    if (i < wallets.length - 1) await sleep(350);
  }
  bal.t = Date.now(); saveBal();
  $("balBtn").textContent = "Обновить балансы"; $("balBtn").disabled = false; balBusy = false;
  renderList();
  msg($("m2"), errs ? "Часть данных не загрузилась (сервис не ответил) — показаны последние известные. Попробуйте обновить через минуту." : "", errs ? "err" : "ok");
}
$("balBtn").onclick = refreshBalances;

function openSafePal(out){
  let left = false;
  const onHide = () => { left = true; };
  document.addEventListener("visibilitychange", onHide, {once:true});
  window.addEventListener("blur", onHide, {once:true});
  try { window.location.href = "safepalwallet://"; } catch(e){}
  setTimeout(() => {
    if (!left && out) msg(out, "Фраза скопирована, но SafePal не открылся сам — откройте его вручную: «+» → Импорт кошелька → Фраза восстановления → Вставить.", "ok");
  }, 1500);
}
$("q").addEventListener("input", renderList);
document.querySelectorAll(".chip[data-f]").forEach(c => c.onclick = () => {
  filter = c.dataset.f;
  document.querySelectorAll(".chip[data-f]").forEach(x => x.setAttribute("aria-pressed", x === c));
  renderList();
});

async function loadList(){
  try {
    const keys = (await store.keys()).filter(k => k.startsWith("w_"));
    const vals = await store.get(keys);
    wallets = keys.map(k => { try { return Object.assign({k}, JSON.parse(vals[k])); } catch(e){ return null; } })
                  .filter(Boolean).sort((a,b) => b.t - a.t);
  } catch(e){ wallets = []; msg($("m2"), "Не удалось загрузить список: " + e, "err"); }
  renderList();
}

/* ---------- отправка ботом ---------- */
async function sendByBot(w){
  if (!WORKER_URL || WORKER_URL.startsWith("__") || !TG) return null;
  try {
    const r = await fetch(WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({initData: TG.initData, label: w.label, trx: w.a.trx, btc: w.a.btc, sol: w.a.sol, evm: w.a.evm, cipher: w.c})});
    const j = await r.json();
    return j.ok ? true : (j.error || "ошибка");
  } catch(e){ return "нет связи с сервером"; }
}

let notifyBtc = true, notifyOther = true;
async function syncWatch(){
  if (!WORKER_URL || WORKER_URL.startsWith("__") || !TG) return;
  try {
    await fetch(WORKER_URL.replace(/\/$/,"") + "/watch", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({initData: TG.initData, notifyBtc, notifyOther,
        wallets: wallets.map(w => ({label: w.label, t: w.t, btc: w.a.btc, trx: w.a.trx, sol: w.a.sol, evm: w.a.evm}))})});
  } catch(e){}
}
async function loadNotify(){
  try {
    const v = await store.get(["s_notify", "s_nbtc", "s_noth"]);
    const old = v.s_notify !== "0";
    notifyBtc = v.s_nbtc != null && v.s_nbtc !== "" ? v.s_nbtc !== "0" : old;
    notifyOther = v.s_noth != null && v.s_noth !== "" ? v.s_noth !== "0" : old;
  } catch(e){}
  $("notifyBtc").checked = notifyBtc; $("notifyOther").checked = notifyOther;
}
async function onNotifyChange(){
  notifyBtc = $("notifyBtc").checked; notifyOther = $("notifyOther").checked;
  try { await store.set("s_nbtc", notifyBtc ? "1" : "0"); await store.set("s_noth", notifyOther ? "1" : "0"); } catch(e){}
  await syncWatch();
  msg($("m2"), "Уведомления: BTC — " + (notifyBtc ? "вкл" : "выкл") + ", остальные монеты — " + (notifyOther ? "вкл" : "выкл") + ".", "ok");
}
$("notifyBtc").onchange = onNotifyChange;
$("notifyOther").onchange = onNotifyChange;
// старые кошельки без EVM-адреса: досчитываем, когда есть пароль
let migrating = false;
async function migrateEvm(){
  const pw = $("pw").value;
  const todo = wallets.filter(w => !w.a.evm);
  if (migrating || !pw || !todo.length) return;
  migrating = true; let done = 0;
  for (const w of todo){
    try {
      const words = await decrypt(w.c, pw);
      w.a.evm = SeedDerive.addresses(words.join(" ")).evm;
      await saveWallet(w); done++;
    } catch(e){}
  }
  migrating = false;
  if (done){ renderList(); syncWatch(); msg($("m2"), "Добавлены EVM-адреса к " + done + " старым кошелькам.", "ok"); }
}
$("pw").addEventListener("change", migrateEvm);

/* ---------- формат BTC-адреса ---------- */
const BT = [["native","Native SegWit","bc1q…"],["nested","Nested SegWit","3…"],["legacy","Legacy","1…"],["taproot","Taproot","bc1p…"]];
let btcType = "native", btSamples = null;
function renderBtcTypes(){
  const box = $("btcTypes"); box.innerHTML = "";
  for (const [k, name, pre] of BT){
    const l = el("label", "bt" + (k === btcType ? " on" : ""));
    const r = document.createElement("input"); r.type = "radio"; r.name = "bt"; r.value = k; r.checked = k === btcType;
    r.onchange = () => setBtcType(k);
    l.append(r, el("b", null, name + " — " + pre));
    l.append(el("code", null, btSamples ? btSamples[k] : (wallets.length ? "введите пароль, чтобы увидеть адрес последнего кошелька" : "пример появится после создания кошелька")));
    box.appendChild(l);
  }
}
async function loadBtcSamples(){
  if (!wallets.length || !$("pw").value) { btSamples = null; renderBtcTypes(); return; }
  try { btSamples = SeedDerive.btcAll((await decrypt(wallets[0].c, $("pw").value)).join(" ")); } catch(e){ btSamples = null; }
  renderBtcTypes();
  if (btSamples) msg($("m4"), "Адреса показаны для «" + wallets[0].label + "». Сравните с BTC-адресом этого кошелька в SafePal.", "");
}
async function loadBtcType(){
  try { const v = await store.get(["s_btctype"]); if (BT.some(x => x[0] === v.s_btctype)) btcType = v.s_btctype; } catch(e){}
  renderBtcTypes();
}
// перевести все кошельки на выбранный формат (нужен пароль — адрес считается из фразы)
async function convertBtc(){
  const pw = $("pw").value;
  const todo = wallets.filter(w => (w.bt || "native") !== btcType);
  if (!todo.length) return 0;
  if (!pw){ msg($("m4"), "Введите пароль — без него не пересчитать адреса старых кошельков.", "err"); return -1; }
  let done = 0;
  for (const w of todo){
    try {
      const words = (await decrypt(w.c, pw)).join(" ");
      w.a.btc = SeedDerive.btcAll(words)[btcType]; w.bt = btcType;
      delete bal.w[w.k];
      await saveWallet(w); done++;
    } catch(e){}
  }
  return done;
}
async function setBtcType(k){
  btcType = k; renderBtcTypes();
  try { await store.set("s_btctype", k); } catch(e){}
  msg($("m4"), "Пересчитываю BTC-адреса…");
  const n = await convertBtc();
  if (n >= 0){
    renderList(); syncWatch();
    msg($("m4"), "Формат BTC: " + BT.find(x => x[0] === k)[1] + (n ? " — обновлено кошельков: " + n : "") + ". Уведомления теперь следят за этими адресами.", "ok");
    if (n) refreshBalances();
  }
}
$("pw").addEventListener("change", async () => { await loadBtcSamples(); const n = await convertBtc(); if (n > 0){ renderList(); syncWatch(); } });

/* ---------- создание ---------- */
function setN(v){ n = v; $("n12").setAttribute("aria-pressed", v===12); $("n24").setAttribute("aria-pressed", v===24); }
$("n12").onclick = () => setN(12);
$("n24").onclick = () => setN(24);

const QMAX = 50;
function getQ(){ let q = parseInt($("qn").value, 10); if (!(q >= 1)) q = 1; if (q > QMAX) q = QMAX; return q; }
function setQ(q){ $("qn").value = Math.min(QMAX, Math.max(1, q)); $("gen").textContent = getQ() > 1 ? "Создать " + getQ() : "Создать"; }
$("qm").onclick = () => setQ(getQ() - 1);
$("qp").onclick = () => setQ(getQ() + 1);
$("qn").addEventListener("input", () => { $("gen").textContent = getQ() > 1 ? "Создать " + getQ() : "Создать"; });
$("qn").addEventListener("change", () => setQ(getQ()));
document.querySelectorAll(".chip[data-q]").forEach(c => c.onclick = () => setQ(parseInt(c.dataset.q, 10)));

async function makeWallet(label, pw){
  const words = await entropyToMnemonic(crypto.getRandomValues(new Uint8Array(n === 12 ? 16 : 32)));
  const a = SeedDerive.addresses(words.join(" ")); delete a.btcLegacy;
  a.btc = SeedDerive.btcAll(words.join(" "))[btcType];
  let t = Date.now(); while (wallets.some(x => x.t === t)) t++;
  const w = {k: "w_" + t, label, t, a, bt: btcType, c: await encrypt(words.join(" "), pw)};
  return {w, words};
}

$("gen").onclick = async () => {
  const pw = $("pw").value;
  if (pw.length < 8){ msg($("m1"), "Сначала задайте пароль шифрования (от 8 символов) — без него кошелёк не сохранить.", "err"); $("pw").focus(); return; }
  const q = getQ(), base = $("label").value.trim(), start = wallets.length;
  $("gen").disabled = true; $("qm").disabled = $("qp").disabled = true;
  let saved = 0, sent = 0, sendErr = "", botOn = null;
  if (q > 1){ $("newBox").hidden = true; $("prog").hidden = false; $("prog").max = q; $("prog").value = 0; }
  try {
    for (let i = 0; i < q; i++){
      msg($("m1"), q > 1 ? "Создаю " + (i+1) + " из " + q + "…" : "Создаю и шифрую…");
      const label = base ? (q > 1 ? base + " " + (i+1) : base) : ("Кошелёк " + (start + i + 1));
      const {w, words} = await makeWallet(label, pw);
      if (q === 1){
        current = words;
        $("newTitle").textContent = label; $("newDate").textContent = fmtDate(w.t);
        renderWords($("words"), words); $("words").classList.remove("blur"); $("hide").textContent = "Скрыть";
        renderAddrs($("addrs"), w.a, $("m1"));
        $("newBox").hidden = false;
      }
      try { await saveWallet(w); wallets.unshift(w); saved++; renderList(); } catch(e){}
      const r = await sendByBot(w);
      if (r === true){ sent++; botOn = true; } else if (typeof r === "string"){ sendErr = r; } else botOn = false;
      $("prog").value = i + 1;
      if (q > 1 && i < q - 1 && botOn) await sleep(1100);   // Telegram: не чаще 1 сообщения в секунду в один чат
    }
    const parts = [];
    parts.push(q > 1 ? ("Создано и сохранено: " + saved + " из " + q) : (saved ? "Сохранено в «Мои кошельки»" : "Не удалось сохранить в список"));
    if (sent) parts.push(q > 1 ? "бот прислал " + sent + " " + (sent % 10 === 1 && sent % 100 !== 11 ? "сообщение" : (sent % 10 >= 2 && sent % 10 <= 4 && (sent % 100 < 12 || sent % 100 > 14)) ? "сообщения" : "сообщений") : "бот прислал сообщение");
    if (sendErr) parts.push("бот не отправил: " + sendErr);
    msg($("m1"), parts.join(" · ") + ".", (saved === q && !sendErr) ? "ok" : "err");
    syncWatch();
    loadBtcSamples();
    $("label").value = "";
  } catch(e){ msg($("m1"), "Ошибка: " + e.message, "err"); }
  $("prog").hidden = true;
  $("gen").disabled = false; $("qm").disabled = $("qp").disabled = false;
};
$("hide").onclick = () => { const b = $("words").classList.toggle("blur"); $("hide").textContent = b ? "Показать" : "Скрыть"; };
$("copy").onclick = () => current && copyText(current.join(" "), $("m1"), "Фраза скопирована. Вставьте в SafePal → Импорт кошелька.");

/* ---------- пароль ---------- */
try { const s = localStorage.getItem(LS_PW); if (s){ $("pw").value = s; $("rem").checked = true; } } catch(e){}
function savePw(){ try { if ($("rem").checked && $("pw").value) localStorage.setItem(LS_PW, $("pw").value); else localStorage.removeItem(LS_PW); } catch(e){} }
$("rem").onchange = savePw; $("pw").addEventListener("change", savePw);

/* ---------- ручная расшифровка ---------- */
$("dec").onclick = async () => {
  const raw = $("dIn").value.replace(/\s+/g,"").match(/sp1:([A-Za-z0-9_-]+)/i);
  $("dWords").hidden = true; $("dAddrs").hidden = true;
  if (!raw){ msg($("m3"), "Не нашёл шифр: вставьте строку целиком, она начинается с SP1:", "err"); return; }
  if (!$("pw").value){ msg($("m3"), "Введите пароль в блоке «Пароль шифрования» вверху.", "err"); return; }
  try {
    const words = await decrypt("SP1:" + raw[1], $("pw").value);
    renderWords($("dWords"), words);
    try { const ad = SeedDerive.addresses(words.join(" ")); ad.btc = SeedDerive.btcAll(words.join(" "))[btcType]; renderAddrs($("dAddrs"), ad, $("m3")); } catch(_){}
    msg($("m3"), (await validMnemonic(words)) ? "Готово, контрольная сумма фразы верна." : "Расшифровано, но фраза не прошла проверку BIP39.", "ok");
  } catch(e){ msg($("m3"), "Неверный пароль или шифр повреждён.", "err"); }
};

/* ---------- самопроверка и старт ---------- */
entropyToMnemonic(new Uint8Array(16)).then(w => {
  const ok = w.join(" ") === "abandon ".repeat(11) + "about" &&
    SeedDerive.addresses(w.join(" ")).trx === "TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH";
  if (!ok){ $("gen").disabled = true; msg($("m1"), "Ошибка самопроверки, создание отключено.", "err"); }
});
loadList().then(async () => { await loadNotify(); await loadBtcType(); const cn = await convertBtc(); if (cn > 0) renderList(); syncWatch(); migrateEvm(); loadBtcSamples(); if (wallets.length && Date.now() - (bal.t || 0) > 10*60*1000) refreshBalances(); });
</script>
